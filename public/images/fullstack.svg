      <stop offset="100%" stop-color="#0a0a16" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg6)" stroke="#3730a3" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e1b4b" />
  <rect x="0" y="24" width="600" height="18" fill="#1e1b4b" />
  <circle cx="24" cy="21" r="5" fill="#f43f5e" />
  <circle cx="40" cy="21" r="5" fill="#fbbf24" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" fill="#a5b4fc" font-family="'Geist', monospace, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">web // fullstack-responsive-interfaces</text>

  <!-- Left: Dashboard Mockup -->
  <rect x="25" y="65" width="260" height="285" rx="12" fill="#0f1026" stroke="#312e81" stroke-width="1.5" />
