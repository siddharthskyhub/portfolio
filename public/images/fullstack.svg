    <rect x="115" y="52" width="115" height="42" rx="6" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="172" y="77" fill="#e0e7ff" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">FastAPI &amp; REST</text>

