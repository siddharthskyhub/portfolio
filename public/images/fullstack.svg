    <text x="172" y="129" fill="#e0e7ff" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL / SQL</text>

    <!-- Bottom summary -->
    <rect x="0" y="156" width="230" height="34" rx="6" fill="#312e81" />
    <text x="115" y="177" fill="#ffffff" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Clean Modular Web Architecture</text>
