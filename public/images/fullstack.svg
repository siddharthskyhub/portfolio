  <text x="60" y="174" fill="#c7d2fe" font-family="'Geist', sans-serif" font-size="9">• Kanban application tracking (SQLite)</text>
  <text x="60" y="186" fill="#c7d2fe" font-family="'Geist', sans-serif" font-size="9">• Dynamic multi-page session state</text>

  <!-- Card 2 -->
  <rect x="45" y="205" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
  <text x="60" y="228" fill="#ffffff" font-family="'Geist', sans-serif" font-size="11" font-weight="700">Production Web Delivery</text>
  <text x="60" y="244" fill="#c7d2fe" font-family="'Geist', sans-serif" font-size="9">• Responsive UI/UX across browsers</text>
  <text x="60" y="256" fill="#c7d2fe" font-family="'Geist', sans-serif" font-size="9">• 3 Internships delivering shipped code</text>

  <rect x="45" y="275" width="220" height="55" rx="8" fill="#0e0f2b" stroke="#6366f1" stroke-width="1" />
  <circle cx="62" cy="295" r="4" fill="#10b981" />
  <text x="75" y="299" fill="#a5b4fc" font-family="'Geist', sans-serif" font-size="10" font-weight="600">Cross-Browser Tested</text>
  <text x="75" y="315" fill="#818cf8" font-family="'Geist', sans-serif" font-size="9">Git version control &amp; team PR reviews</text>

