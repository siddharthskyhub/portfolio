    <rect x="115" y="0" width="115" height="42" rx="6" fill="#1e1b4b" stroke="#4f46e5" />
    <text x="172" y="25" fill="#e0e7ff" font-family="'Geist', sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript / ES6</text>

