  <text x="45" y="116" fill="#818cf8" font-family="'Geist', sans-serif" font-size="11">React, Next.js, Streamlit &amp; REST</text>

  <!-- Card 1 -->
  <rect x="45" y="135" width="220" height="60" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
