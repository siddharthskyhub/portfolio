<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a24" />
      <stop offset="50%" stop-color="#1b1030" />
      <stop offset="100%" stop-color="#0a0514" />
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg1)" stroke="#39245e" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1b1233" />
  <rect x="0" y="24" width="600" height="18" fill="#1b1233" />
  <circle cx="24" cy="21" r="5" fill="#f43f5e" />
  <circle cx="40" cy="21" r="5" fill="#fbbf24" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" fill="#a78bfa" font-family="'Geist', monospace, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">resumate-ai // privacy-first-ats</text>

  <!-- Left Stats Panel -->
  <rect x="25" y="65" width="230" height="285" rx="12" fill="#120921" stroke="#332052" stroke-width="1.5" />
  
  <text x="45" y="100" fill="#e9d5ff" font-family="'Geist', sans-serif" font-size="16" font-weight="700">ResuMate AI</text>
  <text x="45" y="120" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="11">ATS Audit &amp; Skill Evidence Engine</text>

  <!-- Match Score Gauge -->
  <circle cx="140" cy="190" r="45" fill="none" stroke="#261642" stroke-width="8" />
  <circle cx="140" cy="190" r="45" fill="none" stroke="url(#neon1)" stroke-width="8" stroke-dasharray="240" stroke-dashoffset="30" stroke-linecap="round" />
  <text x="140" y="195" fill="#ffffff" font-family="'Geist', sans-serif" font-size="22" font-weight="800" text-anchor="middle">94%</text>
  <text x="140" y="210" fill="#a855f7" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">ATS MATCH</text>

  <!-- Status badges -->
  <rect x="45" y="260" width="85" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="87" y="276" fill="#34d399" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Strong (8)</text>

  <rect x="140" y="260" width="95" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="187" y="276" fill="#818cf8" font-family="'Geist', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Demonstrated (5)</text>

  <rect x="45" y="295" width="190" height="32" rx="8" fill="#1e1035" stroke="#4c1d95" stroke-width="1" />
  <circle cx="62" cy="311" r="5" fill="#10b981" />
  <text x="75" y="315" fill="#d8b4fe" font-family="'Geist', sans-serif" font-size="11" font-weight="500">Local Llama 3.2 • 100% Private</text>

  <!-- Right Architecture Flow -->
  <rect x="275" y="65" width="300" height="285" rx="12" fill="#120921" stroke="#332052" stroke-width="1.5" />
  <text x="295" y="95" fill="#c084fc" font-family="'Geist', sans-serif" font-size="12" font-weight="700" letter-spacing="1">HYBRID RAG RETRIEVAL (RRF)</text>

  <!-- Flow Boxes -->
  <g transform="translate(295, 115)">
    <rect x="0" y="0" width="125" height="42" rx="6" fill="#1e1438" stroke="#6b21a8" />
    <text x="12" y="18" fill="#e9d5ff" font-family="'Geist', sans-serif" font-size="10" font-weight="600">Dense Search</text>
    <text x="12" y="32" fill="#a78bfa" font-family="'Geist', sans-serif" font-size="9">nomic-embed-text</text>

    <rect x="145" y="0" width="125" height="42" rx="6" fill="#1e1438" stroke="#6b21a8" />
    <text x="157" y="18" fill="#e9d5ff" font-family="'Geist', sans-serif" font-size="10" font-weight="600">Keyword Search</text>
    <text x="157" y="32" fill="#a78bfa" font-family="'Geist', sans-serif" font-size="9">BM25 Token Match</text>
    
    <!-- Arrows Down -->
    <path d="M 62 45 L 62 60 L 135 60 L 135 70" stroke="#c084fc" stroke-width="1.5" fill="none" />
    <path d="M 207 45 L 207 60 L 135 60 L 135 70" stroke="#c084fc" stroke-width="1.5" fill="none" />

    <!-- Reciprocal Rank Fusion Box -->
    <rect x="45" y="70" width="180" height="38" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" />
    <text x="135" y="88" fill="#ffffff" font-family="'Geist', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Reciprocal Rank Fusion</text>
    <text x="135" y="100" fill="#d8b4fe" font-family="'Geist', sans-serif" font-size="9" text-anchor="middle">RRF Score = 1 / (60 + rank)</text>

    <!-- Arrow Down -->
    <path d="M 135 110 L 135 125" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- Guardrail Box -->
    <rect x="25" y="125" width="220" height="58" rx="8" fill="#180e2e" stroke="#10b981" stroke-width="1.5" />
    <text x="38" y="145" fill="#34d399" font-family="'Geist', sans-serif" font-size="11" font-weight="700">✓ Anti-Hallucination Guardrail</text>
    <text x="38" y="160" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">Sentence Faithfulness: 0.96 / 1.0</text>
    <text x="38" y="173" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">Rejection &amp; Regeneration on unverified tools</text>

    <!-- Framework tags -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="55" height="20" rx="4" fill="#2d1b4e"/><text x="27" y="14" fill="#c084fc" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Python</text>
      <rect x="62" y="0" width="65" height="20" rx="4" fill="#2d1b4e"/><text x="94" y="14" fill="#c084fc" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Streamlit</text>
      <rect x="134" y="0" width="55" height="20" rx="4" fill="#2d1b4e"/><text x="161" y="14" fill="#c084fc" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Ollama</text>
      <rect x="196" y="0" width="60" height="20" rx="4" fill="#2d1b4e"/><text x="226" y="14" fill="#c084fc" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Pytest</text>
    </g>
  </g>
</svg>