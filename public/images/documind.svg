<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f1f3d" />
      <stop offset="100%" stop-color="#060c1a" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg2)" stroke="#1e3a8a" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0f172a" />
  <rect x="0" y="24" width="600" height="18" fill="#0f172a" />
  <circle cx="24" cy="21" r="5" fill="#f43f5e" />
  <circle cx="40" cy="21" r="5" fill="#fbbf24" />
  <circle cx="56" cy="21" r="5" fill="#10b981" />
  <text x="300" y="26" fill="#38bdf8" font-family="'Geist', monospace, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">documind // fast-api-rag-engine</text>

  <!-- Left: FastAPI Swagger / API Endpoints -->
  <rect x="25" y="65" width="270" height="285" rx="12" fill="#070e1c" stroke="#1e293b" stroke-width="1.5" />
  <text x="45" y="95" fill="#e2e8f0" font-family="'Geist', sans-serif" font-size="16" font-weight="700">DocuMind RAG Core</text>
  <text x="45" y="112" fill="#64748b" font-family="'Geist', sans-serif" font-size="11">High-Precision Technical Docs QA</text>

  <!-- Endpoint 1 -->
  <g transform="translate(45, 130)">
    <rect x="0" y="0" width="230" height="42" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <rect x="8" y="9" width="46" height="24" rx="4" fill="#0284c7" />
    <text x="31" y="25" fill="#ffffff" font-family="'Geist', sans-serif" font-size="10" font-weight="800" text-anchor="middle">POST</text>
    <text x="64" y="25" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="600">/v1/documents/index</text>
  </g>

  <!-- Endpoint 2 -->
  <g transform="translate(45, 182)">
    <rect x="0" y="0" width="230" height="42" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <rect x="8" y="9" width="46" height="24" rx="4" fill="#0284c7" />
    <text x="31" y="25" fill="#ffffff" font-family="'Geist', sans-serif" font-size="10" font-weight="800" text-anchor="middle">POST</text>
    <text x="64" y="25" fill="#bae6fd" font-family="monospace" font-size="11" font-weight="600">/v1/query/hybrid</text>
  </g>

  <!-- Chunking & Indexing Feature Box -->
  <rect x="45" y="235" width="230" height="95" rx="8" fill="#0b172a" stroke="#1e3a8a" stroke-width="1" />
  <text x="58" y="255" fill="#38bdf8" font-family="'Geist', sans-serif" font-size="11" font-weight="700">Sliding-Window Chunking</text>
  <text x="58" y="272" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">• Paragraph overlap with metadata tags</text>
  <text x="58" y="287" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">• Exact error code &amp; symbol retrieval</text>
  <text x="58" y="302" fill="#94a3b8" font-family="'Geist', sans-serif" font-size="9">• Formats: PDF, DOCX, TXT, MD</text>
  <text x="58" y="317" fill="#10b981" font-family="'Geist', sans-serif" font-size="9" font-weight="600">✓ Fully tested with Pytest fixtures</text>

  <!-- Right: Terminal & Citation Preview -->
  <rect x="315" y="65" width="260" height="285" rx="12" fill="#050a14" stroke="#1e293b" stroke-width="1.5" />
  <text x="335" y="95" fill="#38bdf8" font-family="'Geist', monospace, sans-serif" font-size="11" font-weight="600">&gt; curl -X POST /query/hybrid</text>

  <!-- Code Block Mockup -->
  <g transform="translate(330, 110)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#08101d" stroke="#1e293b" />
    <text x="12" y="24" fill="#94a3b8" font-family="monospace" font-size="9">query: "NullPointer in handler.c"</text>
    <text x="12" y="42" fill="#38bdf8" font-family="monospace" font-size="9">dense_score: 0.88 (nomic-embed)</text>
    <text x="12" y="60" fill="#38bdf8" font-family="monospace" font-size="9">bm25_score:  0.94 (exact match)</text>
    <text x="12" y="78" fill="#818cf8" font-family="monospace" font-size="9">rrf_rank:    #1 fused score</text>
    <path d="M 12 90 L 218 90" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="108" fill="#34d399" font-family="monospace" font-size="9">citation: [chunk_id: #sec_4.2]</text>
    <text x="12" y="126" fill="#e2e8f0" font-family="monospace" font-size="9">grounding_check: PASSED (1.0)</text>
    <text x="12" y="140" fill="#a78bfa" font-family="monospace" font-size="9">latency: 38ms • model: llama3.2</text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(330, 275)">
    <rect x="0" y="0" width="50" height="22" rx="4" fill="#0c4a6e"/><text x="25" y="15" fill="#38bdf8" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
    <rect x="56" y="0" width="50" height="22" rx="4" fill="#0c4a6e"/><text x="81" y="15" fill="#38bdf8" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Python</text>
    <rect x="112" y="0" width="55" height="22" rx="4" fill="#0c4a6e"/><text x="139" y="15" fill="#38bdf8" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Ollama</text>
    <rect x="173" y="0" width="55" height="22" rx="4" fill="#0c4a6e"/><text x="200" y="15" fill="#38bdf8" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">BM25</text>
  </g>
</svg>